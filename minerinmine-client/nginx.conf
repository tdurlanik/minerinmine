# ============================================================================
#  MinerInMine istemcisi — nginx yapılandırması
#
#  nginx burada İKİ iş yapıyor:
#    1. Angular'ın derlenmiş dosyalarını sunmak
#    2. /api ile başlayan istekleri API container'ına iletmek (vekil / proxy)
#
#  İKİNCİSİ NEDEN ÖNEMLİ?
#  Geliştirmede tarayıcı 4200'de, API 5080'deydi: FARKLI ORIGIN. Bu yüzden
#  CORS ayarı yapmak ve cookie'yi withCredentials ile taşımak zorundaydık.
#  Burada tarayıcı için her şey TEK ADRESTE (8080): hem sayfa hem /api.
#  Aynı origin olduğu için CORS sorunu ortadan kalkar ve HttpOnly refresh
#  cookie'si hiçbir ek ayar gerektirmeden çalışır.
# ============================================================================

# ----------------------------------------------------------------------------
# WebSocket için yardımcı eşleme (map)
#
# Connection başlığına ne yazılacağını gelen isteğe göre seçer:
#   - istek "Upgrade: websocket" taşıyorsa  -> Connection: upgrade
#   - sıradan bir HTTP isteğiyse (boş)      -> Connection: close
#
# Tek bir sabit değer yazamayız: her isteğe "upgrade" demek sıradan
# istekleri bozar, hiç dememek WebSocket'i engeller.
# ----------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # API vekilliği
    # ------------------------------------------------------------------
    location /api/ {
        # "api" = docker-compose.yml içindeki servis adı. Compose bu adı
        # container'ın IP'sine çözer; IP yazmıyoruz çünkü her başlatmada
        # değişebilir.
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --------------------------------------------------------------
        # WEBSOCKET DESTEĞİ — SignalR için (henüz yazılmadı, hazırlık)
        #
        # WebSocket, sıradan bir HTTP isteğiyle başlar ve "bu bağlantıyı
        # WebSocket'e yükselt" diyen iki başlıkla protokol değiştirir.
        # nginx bu başlıkları KENDİLİĞİNDEN iletmez; aşağıdaki iki satır
        # olmadan SignalR sessizce uzun yoklamaya (long polling) düşer
        # ya da hiç bağlanamaz.
        #
        # Şu an sohbet yokken de zararsız duruyorlar: sıradan HTTP
        # isteklerinde $http_upgrade boş olur ve hiçbir şey değişmez.
        # --------------------------------------------------------------
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket bağlantısı dakikalarca açık kalır; varsayılan 60 sn'lik
        # zaman aşımı onu koparırdı.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # Angular tek sayfa uygulaması (SPA) yönlendirmesi
    #
    # /admin/player/23 adresini tarayıcıda YENİLEDİĞİNDE nginx diskte
    # öyle bir dosya arar, bulamaz ve 404 döndürürdü. Oysa o adres
    # Angular'ın kendi rota tablosuna ait.
    #
    # try_files: "önce dosyayı ara, sonra klasörü, ikisi de yoksa
    # index.html'i ver" — gerisini Angular halleder.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Derlenmiş dosyalar isimlerinde özet (hash) taşır; içerik değişince
    # isim de değişir. Bu yüzden uzun süre önbelleklenebilirler.
    location ~* \.(js|css|woff2|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
